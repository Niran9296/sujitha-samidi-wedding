<style>
  :root{
    --navy: #1B2A4A;
    --navy-deep: #0F1A30;
    --gold: #C9A227;
    --gold-soft: #E4CB6E;
    --ivory: #FAF7F0;
    --blush: #EAD3C6;
    --text: #23262B;
    --muted: #6b6b6b;
    --line: #E6E0D3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--ivory);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
  }
  img { max-width: 100%; display: block; }

  /* ---------- HERO ---------- */
  .hero {
    position: relative;
    min-height: 88vh;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
  }
  .hero img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 25%;
  }
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(15,26,48,0.05) 0%, rgba(15,26,48,0.15) 45%, rgba(15,26,48,0.88) 100%);
  }
  .hero-content {
    position: relative;
    z-index: 2;
    width: 100%;
    text-align: center;
    padding: 0 24px 46px;
    color: var(--ivory);
  }
  .hero-eyebrow {
    font-size: 12.5px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin-bottom: 16px;
  }
  .hero h1 {
    font-family: 'Bodoni Moda', serif;
    font-weight: 500;
    font-size: clamp(42px, 11vw, 92px);
    margin: 0;
    line-height: 1;
    letter-spacing: 0.01em;
  }
  .hero h1 .amp {
    font-style: italic;
    font-weight: 400;
    color: var(--gold-soft);
    display: inline-block;
    padding: 0 6px;
  }
  .hero-divider {
    width: 46px;
    height: 1px;
    background: var(--gold);
    margin: 20px auto;
  }
  .hero-venue {
    font-size: 14px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(250,247,240,0.82);
  }

  /* ---------- GALLERY ---------- */
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    background: var(--navy-deep);
  }
  .gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    aspect-ratio: 1/1;
  }
  .gallery a:first-child {
    grid-row: span 2;
  }
  .gallery a:first-child img { aspect-ratio: 1/2.02; }
  .gallery a { display:block; }

  /* ---------- FIND YOUR TABLE ---------- */
  .finder-section {
    padding: 64px 18px 80px;
  }
  .finder-inner {
    max-width: 540px;
    margin: 0 auto;
  }
  .finder-eyebrow {
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .finder-title {
    font-family: 'Bodoni Moda', serif;
    font-weight: 500;
    text-align: center;
    font-size: clamp(28px, 6vw, 38px);
    margin: 0 0 36px;
    color: var(--navy);
  }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 30px 24px 34px;
    box-shadow: 0 10px 40px rgba(27,42,74,0.06);
  }
  @media (min-width: 480px) {
    .card { padding: 40px 34px 40px; }
  }

  .search-row {
    display: flex;
    gap: 8px;
    position: relative;
    flex-wrap: wrap;
  }
  input[type="text"] {
    flex: 1 1 150px;
    min-width: 0;
    padding: 13px 15px;
    font-size: 15px;
    font-family: 'Outfit', sans-serif;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--ivory);
    color: var(--text);
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--gold); }
  button {
    padding: 13px 22px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Outfit', sans-serif;
    letter-spacing: 0.02em;
    background: var(--navy);
    color: var(--ivory);
    border: none;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s ease;
  }
  button:hover { background: var(--navy-deep); }

  .autocomplete-list {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    max-height: 230px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 8px 26px rgba(27,42,74,0.14);
    z-index: 20;
  }
  .autocomplete-list.show { display: block; }
  .autocomplete-item {
    padding: 11px 14px;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    border-bottom: 1px solid #f1efe8;
  }
  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:hover, .autocomplete-item.active { background: var(--ivory); }
  .autocomplete-item .match { font-weight: 600; color: var(--navy); }

  .voice-toggle {
    text-align: center;
    margin: 16px 0 4px;
  }
  .voice-toggle label {
    font-size: 12.5px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .voice-toggle input { vertical-align: middle; margin-right: 6px; }

  .found-line {
    margin-top: 18px;
    padding: 16px 18px;
    background: var(--ivory);
    border-left: 3px solid var(--gold);
    border-radius: 2px;
    font-size: 14.5px;
    line-height: 1.65;
    display: none;
  }
  .found-line.show { display: block; }
  .found-line .fl-name { font-weight: 600; color: var(--navy); }
  .found-line .fl-table { color: var(--gold); font-weight: 600; }

  .not-found {
    display: none;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 18px 0 0;
  }
  .not-found.show { display: block; }

  .venue-btn-wrap { text-align: center; margin-top: 30px; }
  .venue-btn {
    display: inline-block;
    padding: 13px 30px;
    background: transparent;
    border: 1px solid var(--navy);
    color: var(--navy);
    text-decoration: none;
    font-size: 13.5px;
    letter-spacing: 0.04em;
    border-radius: 3px;
  }
  .venue-btn:hover { background: var(--navy); color: var(--ivory); }

  footer {
    text-align: center;
    padding: 10px 24px 60px;
  }
  footer img {
    width: 92px;
    margin: 0 auto 14px;
  }
  footer p {
    font-family: 'Bodoni Moda', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--navy);
    margin: 0;
  }

  // ---- Custom autocomplete (works reliably across all browsers, including in-app browsers like WhatsApp) ----
  let activeIndex = -1;
  let currentSuggestions = [];

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderSuggestions(query) {
    const key = query.trim().toLowerCase();
    if (!key) { hideSuggestions(); return; }

    const starts = guests.filter(g => g.name.toLowerCase().startsWith(key));
    const contains = guests.filter(g => !g.name.toLowerCase().startsWith(key) && g.name.toLowerCase().includes(key));
    currentSuggestions = [...starts, ...contains].slice(0, 8);
    activeIndex = -1;

    if (currentSuggestions.length === 0) {
      autocompleteList.innerHTML = '<div class="autocomplete-item" style="color:#999;cursor:default;">No matching names</div>';
      autocompleteList.classList.add('show');
      return;
    }

    autocompleteList.innerHTML = currentSuggestions.map((g, i) => {
      const idx = g.name.toLowerCase().indexOf(key);
      let label = escapeHtml(g.name);
      if (idx !== -1) {
        label = escapeHtml(g.name.slice(0, idx)) +
          '<span class="match">' + escapeHtml(g.name.slice(idx, idx + key.length)) + '</span>' +
          escapeHtml(g.name.slice(idx + key.length));
      }
      const tableLabel = g.flexible ? 'Any of: ' + g.tables.join(', ') : 'Table ' + g.tables[0];
      return '<div class="autocomplete-item" data-index="' + i + '">' + label + ' <span style="color:#999;font-size:12.5px;">- ' + tableLabel + '</span></div>';
    }).join('');
    autocompleteList.classList.add('show');
  }

  function hideSuggestions() {
    autocompleteList.classList.remove('show');
    autocompleteList.innerHTML = '';
    currentSuggestions = [];
    activeIndex = -1;
  }

  nameInput.addEventListener('input', () => renderSuggestions(nameInput.value));
  nameInput.addEventListener('focus', () => { if (nameInput.value.trim()) renderSuggestions(nameInput.value); });

  autocompleteList.addEventListener('click', (e) => {
    const item = e.target.closest('.autocomplete-item');
    if (!item || item.dataset.index === undefined) return;
    const idx = parseInt(item.dataset.index, 10);
    const chosen = currentSuggestions[idx];
    if (chosen) {
      nameInput.value = chosen.name;
      hideSuggestions();
      findGuest();
    }
  });

    const voices = window.speechSynthesis.getVoices();

               || voices.find(v => v.lang && v.lang.startsWith('en'));
    maleVoice = voices.find(v => maleHints.some(h => v.name.toLowerCase().includes(h)))
             || voices.find(v => v.lang && v.lang.startsWith('en') && v !== femaleVoice)
             || femaleVoice;
  }
  if ('speechSynthesis' in window) {
    pickVoices();
    window.speechSynthesis.onvoiceschanged = pickVoices;
  }

  function speak(text, gender) {
    if (!voiceEnabled.checked) return;
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 0.95;
    const voice = gender === 'male' ? maleVoice : femaleVoice;
    if (voice) utter.voice = voice;
    utter.pitch = gender === 'male' ? 0.95 : 1.12;
    window.speechSynthesis.speak(utter);
  }

  function firstNameOf(fullName) {
    return fullName.replace(/^(Mr|Mrs|Ms|Miss|Dr|Prof)\.\s*/i, '').split(/[\s&]/)[0];
  }

  function buildFoundLineHtml(g) {
    const tableLabel = g.flexible
      ? 'You may sit at any of tables: <span class="fl-table">' + g.tables.join(', ') + '</span>'
      : 'Table <span class="fl-table">' + g.tables[0] + '</span>';
    return '<span class="fl-name">' + escapeHtml(g.name) + '</span><br>' + tableLabel;
  }

  function buildSpeech(g) {
    const first = firstNameOf(g.name);
    const intro = "Hi " + first + ", thank you for being with us on Sujitha and Samidi's special wedding day. " +
      "We are delighted to have you here to celebrate this beautiful moment together. ";
    if (g.flexible) {
      const list = g.tables.join(', ');
      return intro + "Please feel free to take a seat at any of the following tables, as per your wish: table " + list + ". We hope you enjoy the celebration!";
    }
    return intro + "Your seat number is " + g.tables[0] + ". Please take your seat there. We hope you enjoy the celebration!";
  }

  function findGuest() {
    const raw = nameInput.value.trim();
    if (!raw) return;
    const key = raw.toLowerCase();

    notFoundEl.classList.remove('show');
    foundLine.classList.remove('show');
    foundLine.innerHTML = '';

    let matches = guests.filter(g => g.name.toLowerCase() === key);
    if (matches.length === 0) matches = guests.filter(g => g.name.toLowerCase().includes(key));

    if (matches.length === 0) {
      notFoundEl.classList.add('show');
      return;
    }

    if (matches.length > 1) {
      foundLine.classList.add('show');
      foundLine.innerHTML = 'Multiple matches found — please select your exact name:<br><br>' +
        matches.map(m => buildFoundLineHtml(m)).join('<br><br>');
      return;
    }

    const g = matches[0];
    foundLine.classList.add('show');
    foundLine.innerHTML = buildFoundLineHtml(g);
    speak(buildSpeech(g), g.gender);
  }

  findBtn.addEventListener('click', () => { hideSuggestions(); findGuest(); });
  nameInput.addEventListener('keydown', (e) => {
    const items = autocompleteList.querySelectorAll('.autocomplete-item[data-index]');
    if (e.key === 'ArrowDown' && items.length) {
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, items.length - 1);
      items.forEach((el,i) => el.classList.toggle('active', i===activeIndex));
      items[activeIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp' && items.length) {
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
      items.forEach((el,i) => el.classList.toggle('active', i===activeIndex));
      items[activeIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIndex >= 0 && currentSuggestions[activeIndex]) {
        nameInput.value = currentSuggestions[activeIndex].name;
      }
      hideSuggestions();
      findGuest();
    } else if (e.key === 'Escape') {
      hideSuggestions();
    }
  });
</script>
</body>
</html>
